[project]
name = "reviewhound"
version = "0.1.0"
description = "A pull-request reviewer where the model proposes and code verifies."
authors = [
    { name = "Shubham Attri" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
keywords = ["code-review", "pull-request", "github", "llm", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
reviewhound = "reviewhound.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/reviewhound", "qa"]

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_typescript"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/cases"]
